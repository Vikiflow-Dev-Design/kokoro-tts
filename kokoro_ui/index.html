<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kokoro Studio - TTS Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 29, 47, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: rgba(15, 23, 42, 0.8);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #182238 0%, #0b0f19 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 30%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      padding: 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 640px) {
      .controls-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    select, textarea, input[type="range"] {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 12px 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    select option {
      background: #0f172a;
      color: var(--text);
    }

    .speed-wrapper {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 4px 0;
    }

    input[type="range"] {
      flex: 1;
      padding: 0;
      height: 6px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .speed-val {
      font-weight: 600;
      color: #818cf8;
      min-width: 44px;
      text-align: right;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }

    .badge-info {
      font-size: 0.8rem;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.15);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    button.btn-generate {
      background: linear-gradient(135deg, var(--accent) 0%, #4338ca 100%);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: all 0.2s ease;
    }

    button.btn-generate:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    button.btn-generate:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .player-card {
      margin-top: 10px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .player-card.active {
      display: flex;
    }

    audio {
      width: 100%;
      border-radius: 8px;
      outline: none;
    }

    .download-btn {
      align-self: flex-start;
      color: #818cf8;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .download-btn:hover {
      color: #a5b4fc;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Kokoro Studio</h1>
      <p>High quality local text-to-speech engine</p>
    </header>

    <div class="card">
      <div class="controls-grid">
        <div class="form-group">
          <label for="voice-select">Voice Selection</label>
          <select id="voice-select">
            <option value="blend_fable_echo" selected>Fable + Echo (Storyteller & Rich Blend) ★</option>
            <option value="bm_fable">bm_fable (British Male Storyteller)</option>
            <option value="am_echo">am_echo (American Male Resonant)</option>
            <option value="am_adam">am_adam (American Male Deep)</option>
            <option value="am_onyx">am_onyx (American Male Smooth)</option>
            <option value="bf_alice">bf_alice (British Female Elegant)</option>
            <option value="af_heart">af_heart (American Female Warm)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="speed-slider">Speed <span class="speed-val" id="speed-label">0.85x</span></label>
          <div class="speed-wrapper">
            <input type="range" id="speed-slider" min="0.5" max="1.5" step="0.01" value="0.85">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="input-text">Narration Script</label>
        <textarea id="input-text" placeholder="Type or paste your narration script here..."></textarea>
      </div>

      <div class="actions">
        <span class="badge-info">Default: Blend Voice @ 0.85x</span>
        <button id="btn-submit" class="btn-generate">
          <div class="spinner" id="spinner"></div>
          <span id="btn-text">Generate Audio</span>
        </button>
      </div>
    </div>

    <div class="card player-card" id="player-section">
      <h3 style="font-size: 1rem; color: #a5b4fc; font-weight: 600;">Generated Output</h3>
      <audio id="audio-player" controls></audio>
      <a id="download-link" class="download-btn" href="#" download="narration.wav">⬇ Download WAV</a>
    </div>
  </div>

  <script>
    const voiceSelect = document.getElementById('voice-select');
    const speedSlider = document.getElementById('speed-slider');
    const speedLabel = document.getElementById('speed-label');
    const inputText = document.getElementById('input-text');
    const btnSubmit = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');
    const spinner = document.getElementById('spinner');
    const playerSection = document.getElementById('player-section');
    const audioPlayer = document.getElementById('audio-player');
    const downloadLink = document.getElementById('download-link');

    // Fetch full voice list if available
    fetch('/api/voices')
      .then(res => res.json())
      .then(voices => {
        voiceSelect.innerHTML = '';
        
        // Put default blend first
        const defaultOpt = document.createElement('option');
        defaultOpt.value = 'blend_fable_echo';
        defaultOpt.textContent = '★ Fable + Echo (Storyteller & Rich Blend - Default)';
        defaultOpt.selected = true;
        voiceSelect.appendChild(defaultOpt);

        for (const [key, v] of Object.entries(voices)) {
          if (key === 'blend_fable_echo') continue;
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = `${key} — ${v.name} (${v.accent} ${v.gender}, ${v.desc})`;
          voiceSelect.appendChild(opt);
        }
      })
      .catch(() => {});

    speedSlider.addEventListener('input', (e) => {
      speedLabel.textContent = parseFloat(e.target.value).toFixed(2) + 'x';
    });

    btnSubmit.addEventListener('click', async () => {
      const text = inputText.value.trim();
      if (!text) {
        alert('Please enter some text to generate.');
        return;
      }

      btnSubmit.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Generating...';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: text,
            voice: voiceSelect.value,
            speed: parseFloat(speedSlider.value)
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `Server error: ${response.status}`);
        }

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);

        audioPlayer.src = audioUrl;
        downloadLink.href = audioUrl;
        downloadLink.download = `kokoro_${voiceSelect.value}_${speedSlider.value}.wav`;
        playerSection.classList.add('active');
        audioPlayer.play();
      } catch (err) {
        alert('Generation failed: ' + err.message);
      } finally {
        btnSubmit.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Generate Audio';
      }
    });
  </script>
</body>
</html>
